# StreamFlow — Airflow Core Configuration
# =========================================
# This file overrides Airflow's default settings for the StreamFlow project.
# The full default airflow.cfg is auto-generated inside the container at
# $AIRFLOW_HOME/airflow.cfg on first run — this file only contains the
# settings you are most likely to need to change.
#
# How this is used:
#   The docker-compose.yml mounts this directory as a volume inside the
#   airflow-scheduler and airflow-webserver containers. Airflow reads
#   AIRFLOW__SECTION__KEY env vars (set in docker-compose) first; values
#   here serve as documented defaults and fallback reference.

[core]
# Executor: LocalExecutor is correct for single-machine deployments.
# Switch to CeleryExecutor or KubernetesExecutor for distributed setups.
executor = LocalExecutor

# Do not load the built-in example DAGs (keeps the UI clean)
load_examples = False

# DAGs are active immediately when added — no manual un-pause needed
dags_are_paused_at_creation = False

# How often (seconds) the scheduler scans the dags/ folder for changes
dag_dir_list_interval = 30

[database]
# Connection string is injected via AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
# in docker-compose. Shown here for reference only:
# sql_alchemy_conn = postgresql+psycopg2://admin:admin123@postgres:5432/airflow_db

[webserver]
# Airflow web UI will be available at http://localhost:8080
web_server_port = 8080

# Number of workers for the webserver (gunicorn)
workers = 2

# Expose the REST API (used by the Airflow CLI trigger commands)
expose_config = True

[scheduler]
# How many DAG runs the scheduler will trigger simultaneously
max_active_runs_per_dag = 1

# Catchup is disabled globally — DAGs only run from "now" forward
# (also set per-DAG in cleanup_dag.py)
catchup_by_default = False

[logging]
# Log level for Airflow components
logging_level = INFO

# Where task logs are written inside the container
# (mapped to ./airflow/logs on the host via docker-compose volume)
base_log_folder = /opt/airflow/logs

[smtp]
# Optional — fill in to receive email alerts on DAG failure
# smtp_host = smtp.gmail.com
# smtp_starttls = True
# smtp_ssl = False
# smtp_user = your-email@gmail.com
# smtp_password = your-app-password
# smtp_port = 587
# smtp_mail_from = your-email@gmail.com
