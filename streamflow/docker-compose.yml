# StreamFlow - Docker Compose
# Services: Zookeeper, Kafka, PostgreSQL, pgAdmin, Airflow (webserver + scheduler)

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.1
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://admin:admin123@postgres:5432/airflow_db
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    # Give Airflow tasks access to streamflow DB
    STREAMFLOW_DB_URL: postgresql+psycopg2://admin:admin123@postgres:5432/streamflow_db
    _PIP_ADDITIONAL_REQUIREMENTS: "sqlalchemy psycopg2-binary"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/airflow.cfg:/opt/airflow/airflow.cfg
    - ./airflow/webserver_config.py:/opt/airflow/webserver_config.py
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - streamflow-network

services:
  # ---------------------------------------------------------------------------
  # Zookeeper — required by Kafka for cluster coordination
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - streamflow-network

  # ---------------------------------------------------------------------------
  # Kafka — message broker
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - streamflow-network

  # ---------------------------------------------------------------------------
  # PostgreSQL — stores crypto data + Airflow metadata
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      # Creates streamflow_db; airflow_db is created by the init script below
      POSTGRES_DB: streamflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./airflow/init-airflow-db.sql:/docker-entrypoint-initdb.d/init-airflow-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d streamflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streamflow-network

  # ---------------------------------------------------------------------------
  # pgAdmin — optional database UI (http://localhost:5050)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@streamflow.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - streamflow-network

  # ---------------------------------------------------------------------------
  # Airflow — database initialisation (runs once, then exits)
  # ---------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname StreamFlow \
          --lastname Admin \
          --role Admin \
          --email admin@streamflow.com \
          --password admin123
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Airflow Scheduler — triggers DAG runs on schedule
  # ---------------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Airflow Webserver — UI at http://localhost:8080
  # Credentials: admin / admin123
  # ---------------------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  streamflow-network:
    driver: bridge

volumes:
  postgres_data:
